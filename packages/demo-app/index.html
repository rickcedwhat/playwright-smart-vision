    // Helper to generate random window position within safe viewport bounds

      const taskbarHeight = 50;
      const padding = 10; // Keep windows away from edges
      
      const maxX = canvas.width - windowWidth - padding;
      const maxY = canvas.height - windowHeight - taskbarHeight - padding;
      
      return {
        x: padding + Math.floor(Math.random() * (maxX - padding)),
        y: padding + Math.floor(Math.random() * (maxY - padding))
      };

    function render() {
      if (currentView === 'desktop') {

    function drawDesktop() {
      // Desktop background
      ctx.fillStyle = '#2c5aa0';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Taskbar
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
      
      // Start button
      ctx.fillStyle = '#0078d4';
      ctx.fillRect(10, canvas.height - 40, 80, 30);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('Start', 50, canvas.height - 25);
      ctx.textAlign = 'left';
      
      // Desktop icons
      desktopIcons.forEach(icon => {
        // Icon background (subtle)
        ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.fillRect(icon.x, icon.y, icon.width, icon.height);
        
        // Draw custom icon
        drawDesktopIcon(icon.iconType, icon.x + icon.width / 2, icon.y + 30);
        
        // Icon label with shadow for readability
        ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
        ctx.shadowBlur = 3;
        ctx.shadowOffsetX = 1;
        ctx.shadowOffsetY = 1;
        ctx.fillStyle = '#fff';
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(icon.name, icon.x + icon.width / 2, icon.y + 80);
        ctx.shadowColor = 'transparent';
        ctx.shadowBlur = 0;
        
        // Hover effect
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.strokeRect(icon.x, icon.y, icon.width, icon.height);
      });
      
      ctx.textAlign = 'left';
    }
    
    function drawDesktopIcon(type, centerX, centerY) {
      ctx.save();
      
      if (type === 'crm') {
        // Briefcase icon
        const size = 36;
        const x = centerX - size / 2;
        const y = centerY - size / 2;
        
        // Main briefcase body
        ctx.fillStyle = '#8b7355';
        ctx.fillRect(x + 4, y + 12, size - 8, size - 16);
        
        // Top flap
        ctx.fillStyle = '#a0826d';
        ctx.fillRect(x + 4, y + 8, size - 8, 6);
        
        // Handle
        ctx.strokeStyle = '#6b5a47';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(centerX, y + 8, 8, Math.PI, 0, true);
        ctx.stroke();
        
        // Lock
        ctx.fillStyle = '#ffd700';
        ctx.fillRect(centerX - 3, y + 18, 6, 8);
        ctx.fillStyle = '#333';
        ctx.fillRect(centerX - 1, y + 20, 2, 4);
        
        // Highlights
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.fillRect(x + 6, y + 14, 4, 10);
        
      } else if (type === 'email') {
        // Envelope icon
        const size = 36;
        const x = centerX - size / 2;
        const y = centerY - size / 2;
        
        // Envelope body
        ctx.fillStyle = '#e8e8e8';
        ctx.fillRect(x + 2, y + 8, size - 4, size - 16);
        
        // Envelope flap (back)
        ctx.fillStyle = '#d0d0d0';
        ctx.beginPath();
        ctx.moveTo(x + 2, y + 8);
        ctx.lineTo(centerX, y + 18);
        ctx.lineTo(x + size - 2, y + 8);
        ctx.fill();
        
        // Envelope flap (front)
        ctx.fillStyle = '#f5f5f5';
        ctx.beginPath();
        ctx.moveTo(x + 2, y + 8);
        ctx.lineTo(centerX, y + 20);
        ctx.lineTo(x + size - 2, y + 8);
        ctx.fill();
        
        // Red stamp
        ctx.fillStyle = '#dc3545';
        ctx.fillRect(x + size - 14, y + size - 20, 10, 8);
        
        // Border
        ctx.strokeStyle = '#999';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 2, y + 8, size - 4, size - 16);
        
      } else if (type === 'calendar') {
        // Calendar icon
        const size = 36;
        const x = centerX - size / 2;
        const y = centerY - size / 2;
        
        // Calendar page
        ctx.fillStyle = '#fff';
        ctx.fillRect(x + 4, y + 8, size - 8, size - 12);
        
        // Calendar header (red)
        ctx.fillStyle = '#dc3545';
        ctx.fillRect(x + 4, y + 8, size - 8, 8);
        
        // Binding rings
        ctx.fillStyle = '#666';
        ctx.fillRect(x + 8, y + 6, 3, 4);
        ctx.fillRect(x + size - 11, y + 6, 3, 4);
        
        // Date number "15"
        ctx.fillStyle = '#333';
        ctx.font = 'bold 16px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('15', centerX, y + 24);
        
        // Border
        ctx.strokeStyle = '#ccc';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 4, y + 8, size - 8, size - 12);
        
      } else if (type === 'files') {
        // Folder icon
        const size = 36;
        const x = centerX - size / 2;
        const y = centerY - size / 2;
        
        // Folder back
        ctx.fillStyle = '#ffd966';
        ctx.fillRect(x + 2, y + 14, size - 4, size - 18);
        
        // Folder tab
        ctx.fillStyle = '#f9c74f';
        ctx.beginPath();
        ctx.moveTo(x + 2, y + 14);
        ctx.lineTo(x + 2, y + 10);
        ctx.lineTo(x + 14, y + 10);
        ctx.lineTo(x + 16, y + 14);
        ctx.fill();
        
        // Folder front (lighter)
        ctx.fillStyle = '#ffd966';
        ctx.fillRect(x + 2, y + 14, size - 4, size - 20);
        
        // Folder depth shadow
        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        ctx.fillRect(x + 3, y + 15, size - 6, 2);
        
        // Highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.fillRect(x + 4, y + 18, size - 8, 3);
      }
      
      ctx.restore();
    }
    
    function drawCRMApp() {
      // Desktop background (dimmed)
      ctx.fillStyle = '#2c5aa0';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Taskbar
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
      
      // CRM Application Window

      // CRM content area
      const contentX = crmWindow.x + 10;
      const contentY = crmWindow.y + 40;
      const contentWidth = crmWindow.width - 20;
      const contentHeight = crmWindow.height - 50;
      
      // Sidebar
      ctx.fillStyle = '#f5f5f5';
      ctx.fillRect(contentX, contentY, 180, contentHeight);
      
      // Sidebar items
      const menuItems = ['Dashboard', 'Customers', 'Leads', 'Reports', 'Settings'];
      menuItems.forEach((item, idx) => {
        const itemY = contentY + 20 + (idx * 50);
        ctx.fillStyle = item === 'Customers' ? '#e0e0e0' : 'transparent';
        ctx.fillRect(contentX + 10, itemY, 160, 40);
        
        ctx.fillStyle = '#333';
        ctx.font = '14px Arial';
        ctx.fillText(item, contentX + 20, itemY + 25);
      });
      
      // Main content area
      ctx.fillStyle = '#fff';
      ctx.fillRect(contentX + 190, contentY, contentWidth - 190, contentHeight);
      
      // Customer list header
      ctx.fillStyle = '#333';
      ctx.font = 'bold 18px Arial';
      ctx.fillText('Customer Management', contentX + 210, contentY + 30);
      
      // Search bar
      ctx.strokeStyle = focusedField === 'crmSearch' ? '#007bff' : '#ccc';
      ctx.lineWidth = focusedField === 'crmSearch' ? 2 : 1;
      ctx.strokeRect(contentX + 210, contentY + 50, 300, 30);
      
      // Search value or placeholder
      if (searchValue) {
        ctx.fillStyle = '#000';
        ctx.font = '14px Arial';
        ctx.fillText(searchValue, contentX + 220, contentY + 70);
      } else {
        ctx.fillStyle = '#999';
        ctx.font = '14px Arial';
        ctx.fillText('Search by VIN...', contentX + 220, contentY + 70);
      }
      
      // "New Customer" button
      const newCustomerBtn = {
        x: contentX + 530,
        y: contentY + 50,
        width: 150,
        height: 30
      };
      ctx.fillStyle = '#28a745';
      ctx.fillRect(newCustomerBtn.x, newCustomerBtn.y, newCustomerBtn.width, newCustomerBtn.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('+ New Customer', newCustomerBtn.x + newCustomerBtn.width / 2, newCustomerBtn.y + 20);
      ctx.textAlign = 'left';
      
      // Customer list table
      ctx.strokeStyle = '#ddd';
      ctx.lineWidth = 1;
      const tableY = contentY + 100;
      const tableHeaders = ['Cust #', 'Name', 'VIN', 'Phone'];
      const colWidths = [80, 150, 200, 120];
      let colX = contentX + 210;
      
      // Table header
      const tableWidth = Math.min(colWidths.reduce((a, b) => a + b, 0), contentWidth - 200);
      ctx.fillStyle = '#f8f8f8';
      ctx.fillRect(colX, tableY, tableWidth, 35);
      
      ctx.fillStyle = '#333';
      ctx.font = 'bold 13px Arial';
      tableHeaders.forEach((header, idx) => {
        ctx.fillText(header, colX + 10, tableY + 22);
        colX += colWidths[idx];
      });
      
      // Get filtered customers
      const filteredCustomers = getFilteredCustomers();
      
      filteredCustomers.forEach((customer, rowIdx) => {
        colX = contentX + 210;
        const rowY = tableY + 35 + (rowIdx * 40);
        
        // Row background with hover effect
        if (hoveredTableRow === rowIdx) {
          // Hover state - light blue with shadow
          ctx.fillStyle = '#e3f2fd';
          ctx.fillRect(colX, rowY, tableWidth, 40);
          
          // Add subtle shadow effect
          ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
          ctx.shadowBlur = 8;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = 2;
          ctx.fillStyle = '#e3f2fd';
          ctx.fillRect(colX, rowY, tableWidth, 40);
          ctx.shadowColor = 'transparent';
          ctx.shadowBlur = 0;
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = 0;
        } else if (rowIdx % 2 === 0) {
          // Alternating row background
          ctx.fillStyle = '#fafafa';
          ctx.fillRect(colX, rowY, tableWidth, 40);
        }
        
        ctx.fillStyle = '#333';
        ctx.font = '13px Arial';
        const rowData = [
          customer.customerNumber,
          `${customer.firstName} ${customer.lastName}`,
          customer.vin,
          `${customer.phone.area}-${customer.phone.prefix}-${customer.phone.line}`,
        ];
        
        rowData.forEach((cell, colIdx) => {
          // Truncate text if too long
          const maxWidth = colWidths[colIdx] - 20;
          let displayText = cell;
          if (ctx.measureText(displayText).width > maxWidth) {
            while (ctx.measureText(displayText + '...').width > maxWidth && displayText.length > 0) {
              displayText = displayText.slice(0, -1);
            }
            displayText += '...';
          }
          ctx.fillText(displayText, colX + 10, rowY + 25);
          colX += colWidths[colIdx];
        });
      });
    }
    
    function drawCustomerForm() {
      // Desktop background (more dimmed)
      ctx.fillStyle = '#2c5aa0';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Taskbar
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
      
      // Customer Form Window
      drawWindow(formWindow.x, formWindow.y, formWindow.width, formWindow.height, formWindow.title);
      
      // Form content
      const formContentX = formWindow.x + 20;
      const formContentY = formWindow.y + 40;
      
      // Save canvas state and translate for form rendering
      ctx.save();
      ctx.translate(formContentX, formContentY);
      
      // Draw all form fields (but not open dropdown contents yet)
      for (const [key, field] of Object.entries(fields)) {
        if (field.type === 'checkbox') {
          drawCheckbox(key, field);
        } else if (field.type === 'dropdown') {
          drawDropdown(key, field, false); // false = don't draw options yet
        } else if (field.type === 'button') {
          drawButton(key, field);
        } else {
          drawTextField(key, field);
        }
      }
      
      // Draw cursor in focused field
      if (focusedField && cursorVisible) {
        drawCursor();
      }
      
      // Draw open dropdown on top of everything else
      if (openDropdown && fields[openDropdown]) {
        const field = fields[openDropdown];
        if (field.type === 'dropdown' && field.options) {
          drawDropdownOptions(openDropdown, field);
        }
      }
      
      ctx.restore();
    }
    
    function drawWindow(x, y, width, height, title) {
      // Window shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.fillRect(x + 5, y + 5, width, height);
      
      // Window background
      ctx.fillStyle = '#fff';
      ctx.fillRect(x, y, width, height);
      
      // Title bar
      ctx.fillStyle = '#0078d4';
      ctx.fillRect(x, y, width, 35);
      
      // Title text
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 14px Arial';
      ctx.fillText(title, x + 10, y + 22);
      
      // Window controls (minimize, maximize, close)
      const btnSize = 25;
      const btnY = y + 5;
      
      // Close button
      ctx.fillStyle = '#e81123';
      ctx.fillRect(x + width - btnSize - 5, btnY, btnSize, btnSize);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + width - btnSize + 3, btnY + 8);
      ctx.lineTo(x + width - 13, btnY + btnSize - 8);
      ctx.moveTo(x + width - 13, btnY + 8);
      ctx.lineTo(x + width - btnSize + 3, btnY + btnSize - 8);
      ctx.stroke();
      
      // Maximize button
      ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
      ctx.fillRect(x + width - (btnSize * 2) - 10, btnY, btnSize, btnSize);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + width - (btnSize * 2) - 2, btnY + 8, 10, 10);
      
      // Minimize button
      ctx.fillRect(x + width - (btnSize * 3) - 15, btnY, btnSize, btnSize);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + width - (btnSize * 3) - 7, btnY + btnSize - 10);
      ctx.lineTo(x + width - (btnSize * 3) + 3, btnY + btnSize - 10);
      ctx.stroke();
      
      // Window border
      ctx.strokeStyle = '#0078d4';
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y, width, height);
    }
    
    function drawForm() {
      // This function is now just an alias for render when in form view
      render();
      
      // Draw all fields
      for (const [key, field] of Object.entries(fields)) {
        if (field.type === 'checkbox') {
          drawCheckbox(key, field);
        } else if (field.type === 'dropdown') {
          drawDropdown(key, field);
        } else if (field.type === 'button') {
          drawButton(key, field);
        } else {
          drawTextField(key, field);
        }
      }
      
      // Draw cursor in focused field
      if (focusedField && cursorVisible) {
        drawCursor();
      }
    }
    
    function drawTextField(key, field) {
      // Draw label
      if (field.label && field.labelX !== undefined) {
        ctx.fillStyle = '#333';
        ctx.font = '14px Arial';
        ctx.textBaseline = 'middle';
        ctx.fillText(field.label, field.labelX, field.y + field.height / 2);
      }
      
      // Draw field box
      ctx.strokeStyle = focusedField === key ? '#007bff' : '#999';
      ctx.lineWidth = focusedField === key ? 2 : 1;
      ctx.strokeRect(field.x, field.y, field.width, field.height);
      
      // Draw field value
      const value = getFieldValue(key);
      if (value) {
        ctx.fillStyle = '#000';
        ctx.font = '14px Arial';
        ctx.textBaseline = 'middle';
        ctx.fillText(value, field.x + 5, field.y + field.height / 2);
      }
    }
    
    function drawCheckbox(key, field) {
      // Draw label
      ctx.fillStyle = '#333';
      ctx.font = '14px Arial';
      ctx.textBaseline = 'middle';
      ctx.fillText(field.label, field.labelX, field.y + field.height / 2);
      
      // Draw checkbox
      ctx.strokeStyle = '#999';
      ctx.lineWidth = 1;
      ctx.strokeRect(field.x, field.y, field.width, field.height);
      
      // Draw checkmark if checked
      if (formData[key]) {
        ctx.fillStyle = '#007bff';
        ctx.fillRect(field.x + 3, field.y + 3, field.width - 6, field.height - 6);
      }
    }
    
    function drawDropdown(key, field, drawOptions = true) {
      // Draw label
      ctx.fillStyle = '#333';
      ctx.font = '14px Arial';
      ctx.textBaseline = 'middle';
      ctx.fillText(field.label, field.labelX, field.y + field.height / 2);
      
      // Draw dropdown box
      const isOpen = openDropdown === key;
      ctx.strokeStyle = isOpen ? '#007bff' : '#999';
      ctx.lineWidth = isOpen ? 2 : 1;
      ctx.strokeRect(field.x, field.y, field.width, field.height);
      
      // Draw current value
      ctx.fillStyle = '#000';
      ctx.fillText(formData[key], field.x + 5, field.y + field.height / 2);
      
      // Draw dropdown arrow
      ctx.fillStyle = '#666';
      ctx.beginPath();
      if (isOpen) {
        // Up arrow when open
        ctx.moveTo(field.x + field.width - 20, field.y + 15);
        ctx.lineTo(field.x + field.width - 10, field.y + 15);
        ctx.lineTo(field.x + field.width - 15, field.y + 10);
      } else {
        // Down arrow when closed
        ctx.moveTo(field.x + field.width - 20, field.y + 10);
        ctx.lineTo(field.x + field.width - 10, field.y + 10);
        ctx.lineTo(field.x + field.width - 15, field.y + 15);
      }
      ctx.closePath();
      ctx.fill();
    }
    
    function drawDropdownOptions(key, field) {
      if (!field.options) return;
      
      const optionHeight = 30;
      const dropdownY = field.y + field.height;
      const inset = 2; // Padding inside border
      
      // Draw shadow for depth
      ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 4;
      
      // Draw white background for options
      ctx.fillStyle = '#fff';
      ctx.fillRect(field.x, dropdownY, field.width, field.options.length * optionHeight);
      
      // Reset shadow
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;
      
      // Draw border
      ctx.strokeStyle = '#007bff';
      ctx.lineWidth = 2;
      ctx.strokeRect(field.x, dropdownY, field.width, field.options.length * optionHeight);
      
      // Draw each option
      field.options.forEach((option, idx) => {
        const optY = dropdownY + (idx * optionHeight);
        
        // Hover effect (drawn first, below selection highlight)
        if (hoveredDropdownOption === idx) {
          ctx.fillStyle = '#f5f5f5';
          ctx.fillRect(field.x + inset, optY + inset, field.width - (inset * 2), optionHeight - inset);
        }
        
        // Highlight selected option (drawn on top of hover)
        if (option === formData[key]) {
          ctx.fillStyle = '#e3f2fd';
          ctx.fillRect(field.x + inset, optY + inset, field.width - (inset * 2), optionHeight - inset);
        }
        
        // Draw option text
        ctx.fillStyle = '#333';
        ctx.font = '14px Arial';
        ctx.textBaseline = 'middle';
        ctx.fillText(option, field.x + 8, optY + optionHeight / 2);
        
        // Draw separator line between options
        if (idx < field.options.length - 1) {
          ctx.strokeStyle = '#ddd';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(field.x + inset, optY + optionHeight);
          ctx.lineTo(field.x + field.width - inset, optY + optionHeight);
          ctx.stroke();
        }
      });
    }
    
    function drawButton(key, field) {
      let enabled = key === 'closeButton';
      let buttonText = field.label;
      let bgColor, textColor, borderColor;
      
      if (key === 'saveButton') {
        enabled = formIsDirty && !isSaving;
        
        if (isSaving) {
          // Loading state
          bgColor = '#1e7e34';
          textColor = '#fff';
          borderColor = '#1e7e34';
          buttonText = 'Saving...';
        } else if (!formIsDirty) {
          // Disabled state
          bgColor = '#ccc';
          textColor = '#666';
          borderColor = '#999';
        } else {
          // Enabled state
          bgColor = '#28a745';
          textColor = '#fff';
          borderColor = '#28a745';
        }
      } else {
        // Close button
        bgColor = '#6c757d';
        textColor = '#fff';
        borderColor = '#6c757d';
      }
      
      // Draw button
      ctx.fillStyle = bgColor;
      ctx.fillRect(field.x, field.y, field.width, field.height);
      
      // Draw button border
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 1;
      ctx.strokeRect(field.x, field.y, field.width, field.height);
      
      // Draw button text
      ctx.fillStyle = textColor;
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(buttonText, field.x + field.width / 2, field.y + field.height / 2);
      ctx.textAlign = 'left';
    }
    
    function drawCursor() {
      const field = fields[focusedField];
      if (!field || field.type) return;
      
      const value = getFieldValue(focusedField);
      const textWidth = ctx.measureText(value || '').width;
      
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(field.x + 5 + textWidth, field.y + 5);
      ctx.lineTo(field.x + 5 + textWidth, field.y + field.height - 5);
      ctx.stroke();
    }
    
    function getFieldValue(key) {
      if (key === 'phoneArea') return formData.phone.area;
      if (key === 'phonePrefix') return formData.phone.prefix;
      if (key === 'phoneLine') return formData.phone.line;
      if (key === 'birthMonth') return formData.birthdate.month;
      if (key === 'birthDay') return formData.birthdate.day;
      if (key === 'birthYear') return formData.birthdate.year;
      return formData[key];
    }
    
    function setFieldValue(key, value) {
      if (key === 'phoneArea') formData.phone.area = value;
      else if (key === 'phonePrefix') formData.phone.prefix = value;
      else if (key === 'phoneLine') formData.phone.line = value;
      else if (key === 'birthMonth') formData.birthdate.month = value;
      else if (key === 'birthDay') formData.birthdate.day = value;
      else if (key === 'birthYear') formData.birthdate.year = value;
      else formData[key] = value;
    }
    
    // ============================================================================
    // EVENT HANDLERS
    // ============================================================================
    
    // Handle canvas clicks
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      if (currentView === 'desktop') {
        handleDesktopClick(x, y);
        return;
      } else if (currentView === 'crm-app') {
        handleCRMClick(x, y);
        return;
      } else if (currentView === 'customer-form') {
        handleFormClick(x, y);
        return;
      }
    });
    
    // Handle mouse move for cursor changes and hover effects
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      const cursorType = getCursorTypeForPoint(x, y);
      canvas.classList.toggle('clickable', cursorType === 'pointer');
      canvas.classList.toggle('text-input', cursorType === 'text');
      
      // Update hovered table row for CRM view
      if (currentView === 'crm-app') {
        const contentX = crmWindow.x + 10;
        const contentY = crmWindow.y + 40;
        const tableY = contentY + 135;
        const tableWidth = 550;
        const rowHeight = 40;
        const filteredCustomers = getFilteredCustomers();
        
        let newHoveredRow = -1;
        if (x >= contentX + 210 && x <= contentX + 210 + tableWidth &&
            y >= tableY && y <= tableY + (filteredCustomers.length * rowHeight)) {
          newHoveredRow = Math.floor((y - tableY) / rowHeight);
        }
        
        if (newHoveredRow !== hoveredTableRow) {
          hoveredTableRow = newHoveredRow;
          render();
        }
      } else if (hoveredTableRow !== -1) {
        hoveredTableRow = -1;
        render();
      }
      
      // Update hovered dropdown option for form view
      if (currentView === 'customer-form' && openDropdown) {
        const formContentX = formWindow.x + 20;
        const formContentY = formWindow.y + 40;
        const field = fields[openDropdown];
        
        if (field && field.type === 'dropdown' && field.options) {
          const optionHeight = 30;
          const dropdownY = field.y + field.height;
          const dropdownX = field.x;
          
          let newHoveredOption = -1;
          if (x >= formContentX + dropdownX && x <= formContentX + dropdownX + field.width &&
              y >= formContentY + dropdownY && y <= formContentY + dropdownY + (field.options.length * optionHeight)) {
            newHoveredOption = Math.floor((y - formContentY - dropdownY) / optionHeight);
          }
          
          if (newHoveredOption !== hoveredDropdownOption) {
            hoveredDropdownOption = newHoveredOption;
            render();
          }
        }
      } else if (hoveredDropdownOption !== -1) {
        hoveredDropdownOption = -1;
      }
    });
    
    function handleDesktopClick(x, y) {
      // Check if CRM icon was clicked
      const crmIcon = desktopIcons[0];
      if (x >= crmIcon.x && x <= crmIcon.x + crmIcon.width &&
          y >= crmIcon.y && y <= crmIcon.y + crmIcon.height) {
        // Randomize window position each time it opens
        const pos = randomWindowPosition(crmWindow.width, crmWindow.height);
        crmWindow.x = pos.x;
        crmWindow.y = pos.y;
        currentView = 'crm-app';
        render();
      }
    }
    
    function handleCRMClick(x, y) {
      const contentX = crmWindow.x + 10;
      const contentY = crmWindow.y + 40;
      
      // Check if search box was clicked
      const searchBox = {
        x: contentX + 210,
        y: contentY + 50,
        width: 300,
        height: 30
      };
      
      if (x >= searchBox.x && x <= searchBox.x + searchBox.width &&
          y >= searchBox.y && y <= searchBox.y + searchBox.height) {
        focusedField = 'crmSearch';
        canvas.focus();
        render();
        return;
      }
      
      // Check if "New Customer" button was clicked
      const newCustomerBtn = {
        x: contentX + 530,
        y: contentY + 50,
        width: 150,
        height: 30
      };
      
      if (x >= newCustomerBtn.x && x <= newCustomerBtn.x + newCustomerBtn.width &&
          y >= newCustomerBtn.y && y <= newCustomerBtn.y + newCustomerBtn.height) {
        // Clear form and open new customer
        Object.keys(formData).forEach(key => {
          if (typeof formData[key] === 'object' && formData[key] !== null) {
            if (key === 'phone') {
              formData[key] = { area: '', prefix: '', line: '' };
            } else if (key === 'birthdate') {
              formData[key] = { month: '', day: '', year: '' };
            }
          } else if (typeof formData[key] === 'boolean') {
            formData[key] = false;
          } else if (key === 'contactMethod') {
            formData[key] = 'email';
          } else {
            formData[key] = '';
          }
        });
        originalFormData = null;
        formIsDirty = false;
        
        const pos = randomWindowPosition(formWindow.width, formWindow.height);
        formWindow.x = pos.x;
        formWindow.y = pos.y;
        currentView = 'customer-form';
        render();
        return;
      }
      
      // Check if a table row was clicked
      const tableY = contentY + 135; // Header (35) + first row starts at 100+35
      const tableWidth = 550; // Sum of column widths
      const rowHeight = 40;
      const filteredCustomers = getFilteredCustomers();
      
      if (x >= contentX + 210 && x <= contentX + 210 + tableWidth &&
          y >= tableY && y <= tableY + (filteredCustomers.length * rowHeight)) {
        const rowIndex = Math.floor((y - tableY) / rowHeight);
        if (rowIndex >= 0 && rowIndex < filteredCustomers.length) {
          const customer = filteredCustomers[rowIndex];
          openCustomer(customer);
          return;
        }
      }
      
      // Check if close button was clicked
      const closeX = crmWindow.x + crmWindow.width - 30;
      const closeY = crmWindow.y + 5;
      if (x >= closeX && x <= closeX + 25 && y >= closeY && y <= closeY + 25) {
        currentView = 'desktop';
        searchValue = '';
        focusedField = null;
        render();
      }
    }
    
    function handleFormClick(x, y) {
      // Adjust coordinates relative to form content area
      const formContentX = formWindow.x + 20;
      const formContentY = formWindow.y + 40;
      const relX = x - formContentX;
      const relY = y - formContentY;
      
      // Check if clicking on open dropdown options (these are rendered in absolute coordinates)
      if (openDropdown && fields[openDropdown]) {
        const field = fields[openDropdown];
        if (field.type === 'dropdown' && field.options) {
          const optionHeight = 30;
          const dropdownAbsX = formContentX + field.x;
          const dropdownAbsY = formContentY + field.y + field.height;
          
          if (x >= dropdownAbsX && x <= dropdownAbsX + field.width &&
              y >= dropdownAbsY && y <= dropdownAbsY + (field.options.length * optionHeight)) {
            const optionIndex = Math.floor((y - dropdownAbsY) / optionHeight);
            if (optionIndex >= 0 && optionIndex < field.options.length) {
              formData[openDropdown] = field.options[optionIndex];
              checkFormDirty();
              openDropdown = null;
              hoveredDropdownOption = -1;
              render();
              return;
            }
          }
        }
      }
      
      // Check if close button on form window was clicked
      const closeX = formWindow.x + formWindow.width - 30;
      const closeY = formWindow.y + 5;
      if (x >= closeX && x <= closeX + 25 && y >= closeY && y <= closeY + 25) {
        currentView = 'crm-app';
        focusedField = null;
        openDropdown = null;
        render();
        return;
      }
      
      // Check which field was clicked
      for (const [key, field] of Object.entries(fields)) {
        if (relX >= field.x && relX <= field.x + field.width &&
            relY >= field.y && relY <= field.y + field.height) {
          
          if (field.type === 'checkbox') {
            formData[key] = !formData[key];
            checkFormDirty();
            render();
          } else if (field.type === 'button') {
            handleButtonClick(key);
          } else if (field.type === 'dropdown') {
            // Toggle dropdown open/closed when clicking the field itself
            openDropdown = openDropdown === key ? null : key;
            hoveredDropdownOption = -1;
            render();
          } else {
            focusedField = key;
            canvas.focus(); // Ensure canvas receives keyboard events
            render();
          }
          return;
        }
      }
      
      // Clicked outside any field - close dropdown and clear focus
      focusedField = null;
      openDropdown = null;
      render();
    }
    
    // Handle keyboard input on canvas element
    canvas.addEventListener('keydown', (e) => {
      // Handle CRM search field
      if (currentView === 'crm-app' && focusedField === 'crmSearch') {
        if (e.key === 'Backspace') {
          e.preventDefault();
          searchValue = searchValue.slice(0, -1);
          render(); // Re-render will filter table
          return;
        }
        
        if (e.key.length === 1) {
          e.preventDefault();
          searchValue += e.key;
          render(); // Re-render will filter table
        }
        return;
      }
      
      // Handle customer form fields
      if (currentView !== 'customer-form' || !focusedField) return;
      
      const field = fields[focusedField];
      if (field && field.type) return; // Skip special fields
      
      if (e.key === 'Tab') {
        e.preventDefault();
        focusNextField();
        return;
      }
      
      if (e.key === 'Backspace') {
        e.preventDefault();
        const currentValue = getFieldValue(focusedField);
        setFieldValue(focusedField, currentValue.slice(0, -1));
        checkFormDirty();
        render();
        return;
      }
      
      if (e.key.length === 1) {
        e.preventDefault();
        const currentValue = getFieldValue(focusedField);
        const maxLength = field.maxLength || 100;
        
        if (currentValue.length < maxLength) {
          setFieldValue(focusedField, currentValue + e.key);
          checkFormDirty();
          render();
        }
      }
    });
    
    function focusNextField() {
      const fieldKeys = Object.keys(fields).filter(k => !fields[k].type || fields[k].type === 'dropdown');
      const currentIndex = fieldKeys.indexOf(focusedField);
      const nextIndex = (currentIndex + 1) % fieldKeys.length;
      focusedField = fieldKeys[nextIndex];
      render();
    }
    
    function getFilteredCustomers() {
      const customers = Object.values(customerDatabase);
      
      if (!searchValue.trim()) {
        return customers;
      }
      
      const search = searchValue.trim().toLowerCase();
      return customers.filter(customer => {
        return customer.vin.toLowerCase().includes(search) ||
               customer.firstName.toLowerCase().includes(search) ||
               customer.lastName.toLowerCase().includes(search) ||
               customer.customerNumber.toLowerCase().includes(search);
      });
    }
    
    function openCustomer(customer) {
      // Load customer data into form
      Object.assign(formData, customer);
      
      // Save original data for dirty checking
      originalFormData = JSON.parse(JSON.stringify(formData));
      formIsDirty = false;
      
      // Open customer form at random position
      const pos = randomWindowPosition(formWindow.width, formWindow.height);
      formWindow.x = pos.x;
      formWindow.y = pos.y;
      currentView = 'customer-form';
      focusedField = null;
      render();
    }
    
    function checkFormDirty() {
      if (!originalFormData) {
        formIsDirty = formData.firstName || formData.lastName || formData.email; // Any field filled
        return;
      }
      
      // Deep compare with original
      formIsDirty = JSON.stringify(formData) !== JSON.stringify(originalFormData);
    }
    
    function getCursorTypeForPoint(x, y) {
      if (currentView === 'desktop') {
        // Check desktop icons
        const overIcon = desktopIcons.some(icon => 
          x >= icon.x && x <= icon.x + icon.width &&
          y >= icon.y && y <= icon.y + icon.height
        );
        return overIcon ? 'pointer' : 'default';
      } else if (currentView === 'crm-app') {
        const contentX = crmWindow.x + 10;
        const contentY = crmWindow.y + 40;
        
        // Search box (text input)
        if (x >= contentX + 210 && x <= contentX + 510 && y >= contentY + 50 && y <= contentY + 80) {
          return 'text';
        }
        
        // New Customer button
        if (x >= contentX + 530 && x <= contentX + 680 && y >= contentY + 50 && y <= contentY + 80) {
          return 'pointer';
        }
        
        // Table rows
        const tableY = contentY + 135;
        const tableWidth = 550;
        const rowHeight = 40;
        const filteredCustomers = getFilteredCustomers();
        
        if (x >= contentX + 210 && x <= contentX + 210 + tableWidth &&
            y >= tableY && y <= tableY + (filteredCustomers.length * rowHeight)) {
          return 'pointer';
        }
        
        // Close button
        const closeX = crmWindow.x + crmWindow.width - 30;
        const closeY = crmWindow.y + 5;
        if (x >= closeX && x <= closeX + 25 && y >= closeY && y <= closeY + 25) {
          return 'pointer';
        }
      } else if (currentView === 'customer-form') {
        const formContentX = formWindow.x + 20;
        const formContentY = formWindow.y + 40;
        
        // Check buttons (save is only clickable if dirty and not saving)
        const saveBtn = fields.saveButton;
        const closeBtn = fields.closeButton;
        
        const saveClickable = formIsDirty && !isSaving;
        if (saveClickable && x >= formContentX + saveBtn.x && x <= formContentX + saveBtn.x + saveBtn.width &&
            y >= formContentY + saveBtn.y && y <= formContentY + saveBtn.y + saveBtn.height) {
          return 'pointer';
        }
        
        if (x >= formContentX + closeBtn.x && x <= formContentX + closeBtn.x + closeBtn.width &&
            y >= formContentY + closeBtn.y && y <= formContentY + closeBtn.y + closeBtn.height) {
          return 'pointer';
        }
        
        // Check text input fields
        for (const [key, field] of Object.entries(fields)) {
          if (field.type === 'button') continue;
          if (x >= formContentX + field.x && x <= formContentX + field.x + field.width &&
              y >= formContentY + field.y && y <= formContentY + field.y + field.height) {
            // Text fields get text cursor, dropdowns and checkboxes get pointer
            if (!field.type) {
              return 'text';
            }
            return 'pointer'; // dropdowns and checkboxes
          }
          
          // Check if hovering over open dropdown options
          if (field.type === 'dropdown' && openDropdown === key && field.options) {
            const optionHeight = 30;
            const dropdownY = field.y + field.height;
            if (x >= formContentX + field.x && x <= formContentX + field.x + field.width &&
                y >= formContentY + dropdownY && y <= formContentY + dropdownY + (field.options.length * optionHeight)) {
              return 'pointer';
            }
          }
        }
        
        // Close button on window
        const closeX = formWindow.x + formWindow.width - 30;
        const closeY = formWindow.y + 5;
        if (x >= closeX && x <= closeX + 25 && y >= closeY && y <= closeY + 25) {
          return 'pointer';
        }
      }
      
      return 'default';
    }
    
    // ============================================================================
    // CONTROL FUNCTIONS
    // ============================================================================
    
    async function handleButtonClick(key) {
      if (key === 'saveButton' && formIsDirty && !isSaving) {
        // Start saving
        isSaving = true;
        render();
        
        // Mock backend save (1 second delay)
        await new Promise(resolve => setTimeout(resolve, 1000));
        
        // Save complete - update original data and clear dirty flag
        originalFormData = JSON.parse(JSON.stringify(formData));
        formIsDirty = false;
        isSaving = false;
        render();
      } else if (key === 'closeButton') {
        currentView = 'crm-app';
        focusedField = null;
        openDropdown = null;
        originalFormData = null;
        formIsDirty = false;
        isSaving = false;
        render();
      }
    }
    
    // Cursor blink animation
    setInterval(() => {
      cursorVisible = !cursorVisible;
      if (currentView === 'customer-form' && focusedField) render();
    }, 500);
    
    // Expose for debugging/testing
    window.formData = formData;
    window.render = render;
    
    // Simple test API: map screen element names to canvas field keys
    const elementToFieldMap = {
      'firstName': 'firstName',
      'lastName': 'lastName',
      'area': 'phoneArea',
      'prefix': 'phonePrefix',
      'line': 'phoneLine',
    };
    
    // Helper for automated testing: fill by element name
    window.testFillElement = (elementName, partName, value) => {
      const key = partName ? elementToFieldMap[partName] : elementToFieldMap[elementName];
      if (key) {
        setFieldValue(key, value);
        checkFormDirty();
        render();
        return true;
      }
      return false;
    };
    
    // Helper for automated testing: open customer by VIN
    window.testOpenCustomerByVIN = (vin) => {
      const customer = customerDatabase[vin];
      if (customer) {
        openCustomer(customer);
      }
    };
    
    // Helper to get available test VINs
    window.testGetSampleVINs = () => Object.keys(customerDatabase);
    
    // Helper to get form state
    window.testGetFormState = () => ({
      isDirty: formIsDirty,
      isSaving: isSaving,
    });

    // Initial render
    render();
  </script>
</body>
</html>
