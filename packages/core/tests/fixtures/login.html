<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="hub-nav.css">
</head>
<body>
  <div class="app">
    <div class="window login">
      <div class="titlebar">Customer Information - Sign In</div>
      <form class="body" id="loginForm" action="customer.html" method="get">
        <div class="row">
          <label class="label" for="username">Username:</label>
          <input id="username" name="username" type="text" class="long" autocomplete="off">
        </div>
        <div class="row">
          <label class="label" for="password">Password:</label>
          <input id="password" name="password" type="password" class="long" autocomplete="off">
        </div>
        <div class="btns">
          <button type="submit" id="signIn">Sign In</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', (event) => {
      event.preventDefault();
      sessionStorage.setItem('ocrLoggedIn', '1');
      window.location.href = 'customer.html';
    });
  </script>
  <script src="hub-nav.js"></script>
</body>
</html>
