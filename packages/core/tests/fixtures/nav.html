<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Main Menu</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="hub-nav.css">
</head>
<body>
  <div class="app">
    <div class="window nav-window">
      <div class="titlebar">Customer Information System</div>
      <div class="body">
        <div class="nav-grid">
          <button type="button" class="nav-btn" id="customerSearch">Customer Search</button>
          <button type="button" class="nav-btn" id="vehicleInventory">Vehicle Inventory</button>
          <button type="button" class="nav-btn" id="service">Service</button>
          <button type="button" class="nav-btn" id="fni">F &amp; I</button>
          <button type="button" class="nav-btn" id="parts">Parts</button>
          <button type="button" class="nav-btn" id="reports">Reports</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    const isBlankMode = new URLSearchParams(location.search).has('blank');
    if (!isBlankMode && sessionStorage.getItem('ocrLoggedIn') !== '1') {
      window.location.href = 'login.html';
    }
    document.getElementById('customerSearch').addEventListener('click', () => {
      window.location.href = 'customer.html';
    });
  </script>
  <script src="hub-nav.js"></script>
</body>
</html>
